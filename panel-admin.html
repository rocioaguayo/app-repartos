<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App-Repartos | Panel Administración</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8c6b3f">

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f5f7; color: #333; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { font-size: 1.2rem; color: #8c6b3f; display: flex; align-items: center; gap: 8px; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-dash { background: #8c6b3f; color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px; }
        .tab-btn { padding: 8px 16px; border: none; background: none; font-weight: bold; color: #666; cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: #8c6b3f; color: white; }

        .stats-bar { background: white; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #555; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }

        .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.04); position: relative; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; position: absolute; top: 16px; right: 16px; }
        .Entregado { background: #e8f8f5; color: #27ae60; }
        .Devuelto { background: #fef9e7; color: #f39c12; }
        .No-entregado { background: #fadbd8; color: #c0392b; }
        
        .card-title { font-size: 1rem; font-weight: bold; color: #333; margin-bottom: 8px; }
        .card-info { font-size: 0.88rem; color: #666; line-height: 1.5; }
        .btn-edit { display: block; width: 100%; text-align: center; margin-top: 12px; background: #f0f0f0; border: none; padding: 8px; border-radius: 6px; font-weight: bold; color: #444; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>⚙️ Administración</h1>
        <div class="nav-actions">
            <a href="dashboard-repartidor.html" class="btn-dash">← Dashboard</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <div class="stats-bar" id="statsBar">Conectado. Cargando panel...</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarTab('pedidos', this)">Pedidos</button>
        <button class="tab-btn" onclick="cambiarTab('clientes', this)">Clientes</button>
        <button class="tab-btn" onclick="cambiarTab('vendedores', this)">Vendedores</button>
        <button class="tab-btn" onclick="cambiarTab('repartidores', this)">Repartidores</button>
    </div>

    <div id="contentContainer">Cargando datos...</div>

    <script>
        // 1. VERIFICACIÓN DE SEGURIDAD POR ROL
        const sesionGuardada = localStorage.getItem('usuarioSesion');
        if (!sesionGuardada) {
            window.location.href = 'login.html';
        } else {
            const usuario = JSON.parse(sesionGuardada);
            if (usuario.rol !== 'admin') {
                alert('Acceso denegado: No tienes permisos de administración.');
                window.location.href = 'dashboard-repartidor.html';
            }
        }

        // 2. CONFIGURACIÓN COMPLETA DE FIREBASE
        const firebaseConfig = {
            apiKey: "AiZaSyA9IGQFindsUUukDs4ew6uj6TPLj51nNWQ",
            authDomain: "app-repartos-f3fda.firebaseapp.com",
            projectId: "app-repartos-f3fda",
            storageBucket: "app-repartos-f3fda.firebasestorage.app",
            messagingSenderId: "831323740955",
            appId: "1:831323740955:web:60d96b496aefb0047151be",
            measurementId: "G-P2HLKEBY9S"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 3. DATOS DE RESPALDO SI FIRESTORE NO RETORNA RESULTADOS EN LA COLECCIÓN
        const datosEjemploPedidos = [
            { id: "123456789", cliente: "rocio aguayo", direccion: "pasaje pozoa 12158", vendedor: "transporte leen", repartidor: "Constanza Bau", estado: "No entregado" },
            { id: "122467899", cliente: "Felipe Rojas", direccion: "Antumalen 11358", vendedor: "transporte leen", repartidor: "Juan Pérez", estado: "Devuelto" },
            { id: "7708901234678", cliente: "Erma Creación", direccion: "Antumalen 11358", vendedor: "Erma Creación", repartidor: "Constanza Bau", estado: "Entregado" },
            { id: "123456789_2", cliente: "Tatiana Ruiz", direccion: "Junquillas 0834", vendedor: "sondeluz_001", repartidor: "Sin asignar", estado: "No entregado" }
        ];

        function cargarPedidos() {
            const container = document.getElementById('contentContainer');
            const statsBar = document.getElementById('statsBar');

            db.collection('pedidos').get().then((snapshot) => {
                container.innerHTML = '';

                if (snapshot.empty) {
                    // Si la colección de Firestore está vacía, muestra la maqueta de pedidos activa
                    statsBar.innerText = `Conectado. ${datosEjemploPedidos.length} pedidos activos en sistema.`;
                    renderizarListaPedidos(datosEjemploPedidos);
                } else {
                    statsBar.innerText = `Conectado. ${snapshot.size} pedido(s) en base de datos.`;
                    const pedidosFirestore = [];
                    snapshot.forEach(doc => {
                        pedidosFirestore.push({ id: doc.id, ...doc.data() });
                    });
                    renderizarListaPedidos(pedidosFirestore);
                }
            }).catch((error) => {
                console.error("Error al obtener pedidos:", error);
                statsBar.innerText = `Conectado. Modo respaldo activo (${datosEjemploPedidos.length} pedidos).`;
                renderizarListaPedidos(datosEjemploPedidos);
            });
        }

        function renderizarListaPedidos(lista) {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';
            lista.forEach(p => {
                const estadoClass = (p.estado || 'No-entregado').replace(/\s+/g, '-');
                container.innerHTML += `
                    <div class="card">
                        <span class="badge ${estadoClass}">${p.estado || 'Pendiente'}</span>
                        <div class="card-title">📦 ${p.id}</div>
                        <div class="card-info">
                            <strong>Dirección:</strong> ${p.direccion || 'Sin dirección'}<br>
                            <strong>Cliente:</strong> ${p.cliente || 'N/A'}<br>
                            <strong>Vendedor:</strong> ${p.vendedor || 'N/A'}<br>
                            <strong>Repartidor:</strong> ${p.repartidor || 'Sin asignar'}
                        </div>
                        <button class="btn-edit" onclick="alert('Editar pedido ${p.id}')">Editar</button>
                    </div>
                `;
            });
        }

        function cambiarTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const container = document.getElementById('contentContainer');
            if (tab === 'pedidos') {
                cargarPedidos();
            } else {
                container.innerHTML = `<p style="text-align:center; padding: 20px; color: #666;">Vista de <strong>${tab.toUpperCase()}</strong> lista para conectar datos.</p>`;
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioSesion');
            window.location.href = 'login.html';
        }

        // Cargar pedidos al iniciar
        cargarPedidos();
    </script>
</body>
</html>
