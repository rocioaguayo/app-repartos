<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App-Repartos | Panel Administración</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8c6b3f">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f5f7; color: #333; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { font-size: 1.2rem; color: #8c6b3f; display: flex; align-items: center; gap: 8px; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; float: right; }
        .Entregado { background: #e8f8f5; color: #27ae60; }
        .Devuelto { background: #fef9e7; color: #f39c12; }
        .No-entregado { background: #fadbd8; color: #c0392b; }
    </style>
</head>
<body>

    <header>
        <h1>⚙️ Administración</h1>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <div id="pedidosContainer">Cargando todos los pedidos...</div>

    <script>
        // 1. CONTROL DE ACCESO RIGUROSO POR ROL
        const sesionGuardada = localStorage.getItem('usuarioSesion');
        if (!sesionGuardada) {
            window.location.href = 'login.html';
        } else {
            const usuario = JSON.parse(sesionGuardada);
            if (usuario.rol !== 'admin') {
                alert('Acceso denegado: No tienes permisos de administración.');
                window.location.href = 'dashboard-repartidor.html';
            }
        }

        // Configuración Firebase (Reemplaza con tus llaves exactas)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "app-repartos-f3fda.firebaseapp.com",
            projectId: "app-repartos-f3fda",
            storageBucket: "app-repartos-f3fda.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Cargar TODOS los pedidos del sistema
        db.collection('pedidos').onSnapshot((snapshot) => {
            const container = document.getElementById('pedidosContainer');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<p>No hay pedidos registrados.</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const estadoClass = (data.estado || 'No-entregado').replace(/\s+/g, '-');
                container.innerHTML += `
                    <div class="card">
                        <span class="badge ${estadoClass}">${data.estado || 'Pendiente'}</span>
                        <strong>📦 Ord: ${doc.id}</strong><br>
                        <small>📍 Dirección: ${data.direccion || 'Sin dirección'}</small><br>
                        <small>👤 Cliente: ${data.cliente || 'N/A'}</small><br>
                        <small>🚚 Repartidor: ${data.repartidor || 'Sin asignar'}</small>
                    </div>
                `;
            });
        });

        function cerrarSesion() {
            localStorage.removeItem('usuarioSesion');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
