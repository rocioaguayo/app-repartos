<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App-Repartos | Mi ruta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b9935a">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Karla',Arial,sans-serif;background:#faf7f4;color:#2f2b28;padding-bottom:40px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#fff;border-bottom:1px solid #e9e0d8;position:sticky;top:0}
header h1{font-family:'Fraunces',serif;font-size:17px;color:#8f6f3f}
header button{background:#f2ece6;border:none;border-radius:20px;padding:7px 14px;font:700 12px Karla,sans-serif;color:#8c8177}
main{max-width:560px;margin:0 auto;padding:16px}
.pedido{background:#fff;border:1px solid #e9e0d8;border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.cod{font-weight:700}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;height:fit-content}
.pendiente{background:#f1e4cd;color:#8f6f3f}.en_camino{background:#f7e4e9;color:#b96780}
.entregado{background:#e6ede4;color:#6f8f6a}.no_entregado{background:#f3e2e1;color:#b1615f}.devuelto{background:#efe7dd;color:#a08b76}
.det{font-size:13px;color:#8c8177;margin-top:3px}
.enlaces{display:flex;gap:8px;margin:12px 0 8px}
.enlaces a{flex:1;text-align:center;padding:10px;border-radius:10px;background:#f2ece6;color:#2f2b28;font-size:13px;font-weight:700;text-decoration:none}
select{width:100%;padding:11px;border:1px solid #e9e0d8;border-radius:10px;font:14px Karla,sans-serif;background:#faf7f4}
.msg{text-align:center;color:#8c8177;font-size:14px;padding:30px 0}
</style>
</head>
<body>
<header><h1 id="saludo">Mi ruta</h1><button id="salir">Salir</button></header>
<main id="lista"><div class="msg">Cargando tus entregas...</div></main>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyA91GQFimdsUUukDs4ew6uj6TPLj51nNWQ",
  authDomain: "app-repartos-f3fda.firebaseapp.com",
  projectId: "app-repartos-f3fda",
  storageBucket: "app-repartos-f3fda.firebasestorage.app",
  messagingSenderId: "831323740955",
  appId: "1:831323740955:web:60d96b496aefb0047151be"
});
var auth = firebase.auth(), db = firebase.firestore();
var lista = document.getElementById("lista");
var estados = { pendiente: "Pendiente", en_camino: "En camino", entregado: "Entregado", no_entregado: "No entregado", devuelto: "Devuelto" };

function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
function aviso(t) { lista.innerHTML = "<div class='msg'>" + esc(t) + "</div>"; }

document.getElementById("salir").addEventListener("click", function () {
  auth.signOut().then(function () { location.href = "login.html"; });
});

auth.onAuthStateChanged(function (u) {
  if (!u) { location.href = "login.html"; return; }
  db.collection("usuarios").doc(u.uid).get().then(function (d) {
    var p = d.exists ? d.data() : null;
    if (!p || p.activo === false) { auth.signOut(); return; }
    if (p.rol === "admin") { location.href = "panel-admin.html"; return; }
    if (p.rol !== "repartidor" || !p.repartidorId) { aviso("Tu cuenta no tiene un repartidor asociado. Avisa al administrador."); return; }
    document.getElementById("saludo").textContent = "Hola, " + (p.nombre || "repartidor");
    db.collection("Pedidos").where("repartidor_id", "==", p.repartidorId).onSnapshot(pintar, function (e) {
      aviso("No se pudieron cargar los pedidos: " + e.message);
    });
  }).catch(function (e) { aviso("Error al leer tu perfil: " + e.message); });
});

function pintar(snap) {
  if (snap.empty) { aviso("No tienes pedidos asignados."); return; }
  lista.innerHTML = "";
  snap.forEach(function (doc) {
    var p = doc.data(), est = p.estado || "pendiente";
    var tel = String(p.cliente_telefono || "").replace(/\D/g, "");
    var mapa = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.direccion_entrega || "");
    var div = document.createElement("div");
    div.className = "pedido";
    div.innerHTML =
      "<div class='top'><span class='cod'>📦 " + esc(p.codigo_barra || doc.id) + "</span><span class='badge " + esc(est) + "'>" + esc(estados[est] || est) + "</span></div>" +
      "<div class='det'>Cliente: " + esc(p.cliente_nombre || "-") + "</div>" +
      "<div class='det'>" + esc(p.direccion_entrega || "Sin dirección") + "</div>" +
      "<div class='enlaces'><a href='" + mapa + "' target='_blank' rel='noopener'>Abrir en Maps</a>" +
      (tel ? "<a href='https://wa.me/" + tel + "' target='_blank' rel='noopener'>WhatsApp</a><a href='tel:+" + tel + "'>Llamar</a>" : "") + "</div>" +
      "<select data-id='" + esc(doc.id) + "'>" + Object.keys(estados).map(function (k) {
        return "<option value='" + k + "'" + (k === est ? " selected" : "") + ">" + estados[k] + "</option>";
      }).join("") + "</select>";
    lista.appendChild(div);
  });
  lista.querySelectorAll("select").forEach(function (s) {
    s.addEventListener("change", function () {
      db.collection("Pedidos").doc(s.getAttribute("data-id")).update({ estado: s.value })
        .catch(function (e) { alert("No se pudo actualizar: " + e.message); });
    });
  });
}
</script>
</body>
</html>
