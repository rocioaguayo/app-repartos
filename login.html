<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App-Repartos | Iniciar Sesión</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8c6b3f">

    <!-- SDKs Compatibles de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f3e9e1 0%, #e2cfc4 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #ffffff; width: 100%; max-width: 380px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #8c6b3f; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { color: #888888; font-size: 0.9rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 14px 16px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 1rem; outline: none; }
        .btn-login { width: 100%; padding: 14px; background-color: #b58d59; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #d9534f; font-size: 0.85rem; margin-top: 12px; font-weight: 500; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">📦 App-Repartos</div>
        <div class="subtitle">Inicia sesión para continuar</div>

        <div class="input-group">
            <input type="email" id="email" placeholder="Correo electrónico">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Contraseña">
        </div>
        <button type="button" class="btn-login" id="btnSubmit" onclick="iniciarSesion()">Iniciar sesión</button>
        
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script>
        // CONFIGURACIÓN DIRECTA DE FIREBASE
        // Reemplaza los datos de abajo con las llaves de tu proyecto en la consola de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "app-repartos-f3fda.firebaseapp.com",
            projectId: "app-repartos-f3fda",
            storageBucket: "app-repartos-f3fda.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase solo si no se ha hecho previamente
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        async function iniciarSesion() {
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btnSubmit = document.getElementById('btnSubmit');

            errorMsg.style.display = 'none';
            errorMsg.innerText = '';

            if (!emailInput || !passwordInput) {
                errorMsg.innerText = 'Por favor completa todos los campos.';
                errorMsg.style.display = 'block';
                return;
            }

            btnSubmit.innerText = 'Verificando...';
            btnSubmit.disabled = true;

            try {
                // Consulta a la colección /usuarios
                const snapshot = await db.collection('usuarios')
                    .where('email', '==', emailInput)
                    .where('clave', '==', passwordInput)
                    .get();

                if (snapshot.empty) {
                    errorMsg.innerText = 'Correo o contraseña incorrectos.';
                    errorMsg.style.display = 'block';
                    btnSubmit.innerText = 'Iniciar sesión';
                    btnSubmit.disabled = false;
                } else {
                    const userData = snapshot.docs[0].data();
                    
                    // Guardar los datos en el almacenamiento local de la sesión
                    localStorage.setItem('usuarioSesion', JSON.stringify(userData));

                    // Redirección condicional por ROL
                    if (userData.rol === 'admin') {
                        window.location.href = 'panel-admin.html';
                    } else if (userData.rol === 'repartidor') {
                        window.location.href = 'dashboard-repartidor.html';
                    } else {
                        errorMsg.innerText = 'El usuario no tiene un rol válido asignado.';
                        errorMsg.style.display = 'block';
                        btnSubmit.innerText = 'Iniciar sesión';
                        btnSubmit.disabled = false;
                    }
                }
            } catch (error) {
                console.error("Error de login:", error);
                errorMsg.innerText = 'Error de conexión con la base de datos.';
                errorMsg.style.display = 'block';
                btnSubmit.innerText = 'Iniciar sesión';
                btnSubmit.disabled = false;
            }
        }
    </script>

</body>
</html>
