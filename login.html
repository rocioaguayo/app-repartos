<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Transporte Leen | Iniciar sesión</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b192c">
  
  <!-- Tipografía Plus Jakarta Sans & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0b192c;
      --navy-main: #1e3e62;
      --navy-card: #172554;
      --orange-brand: #ff6500;
      --orange-hover: #e05500;
      --orange-light: rgba(255, 101, 0, 0.15);
      --text-white: #ffffff;
      --text-slate: #cbd5e1;
      --border: rgba(255, 255, 255, 0.15);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--navy-main);
      border: 2px solid var(--orange-brand);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .brand-header {
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--orange-brand);
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(255, 101, 0, 0.3);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--orange-brand);
    }

    p.sub {
      color: var(--text-slate);
      font-size: 14px;
      margin-top: 4px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-slate);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--orange-brand);
    }

    input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg-dark);
      color: var(--text-white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--orange-brand);
      box-shadow: 0 0 0 3px rgba(255, 101, 0, 0.25);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--orange-brand);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(255, 101, 0, 0.4);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background: var(--orange-hover);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .roles {
      display: flex;
      gap: 6px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 20px;
    }

    .roles button {
      flex: 1;
      margin: 0;
      padding: 10px 8px;
      font-size: 13px;
      background: transparent;
      color: var(--text-slate);
      box-shadow: none;
      border-radius: 10px;
    }

    .roles button:hover {
      background: var(--orange-light);
    }

    .roles button.activo {
      background: var(--orange-brand);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 101, 0, 0.3);
    }

    #error {
      color: #f87171;
      font-size: 13px;
      margin-top: 14px;
      min-height: 18px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
      padding: 8px;
      display: none;
    }

    #error:not(:empty) {
      display: block;
    }

    #exito {
      color: #34d399;
      font-size: 13px;
      margin-top: 14px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.12);
      border-radius: 8px;
      padding: 8px;
      display: none;
    }

    #exito:not(:empty) {
      display: block;
    }

    .olvide {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-slate);
      text-decoration: none;
    }

    .olvide:hover {
      color: var(--orange-brand);
    }

    .roles button {
      width: auto;
      min-width: 0;
      font-size: 12px;
      gap: 5px;
      padding: 10px 4px;
      white-space: nowrap;
    }

    .roles button svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* En celulares angostos se ocultan los íconos para que entren las tres pestañas. */
    @media (max-width: 420px) {
      .roles button svg { display: none; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand-header">
    <img src="https://lh3.googleusercontent.com/d/1oL2f76kZu7bM0JVvcVgL9jtYniuKQtSc" class="brand-logo" alt="Transporte Leen">
    <h1>TRANSPORTE <span>LEEN</span></h1>
    <p class="sub" id="subtitulo">Ingresa con tu correo y contraseña</p>
  </div>

  <div class="roles" role="tablist" aria-label="Tipo de acceso">
    <button type="button" role="tab" data-rol="admin" class="activo" aria-selected="true">
      <i data-lucide="shield-check" size="16"></i> Administrador
    </button>
    <button type="button" role="tab" data-rol="repartidor" aria-selected="false">
      <i data-lucide="truck" size="16"></i> Repartidor
    </button>
    <button type="button" role="tab" data-rol="cliente" aria-selected="false">
      <i data-lucide="store" size="16"></i> Cliente
    </button>
  </div>

  <div class="form-group">
    <label for="email">Correo electrónico</label>
    <div class="input-wrapper">
      <i data-lucide="mail" size="18"></i>
      <input type="email" id="email" placeholder="ejemplo@soymas.cl" autocomplete="username">
    </div>
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <div class="input-wrapper">
      <i data-lucide="lock" size="18"></i>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
  </div>

  <button id="btn">
    <i data-lucide="log-in" size="18"></i> Iniciar sesión
  </button>

  <a href="#" id="olvide" class="olvide">¿Olvidaste tu contraseña?</a>

  <div id="error" role="alert"></div>
  <div id="exito" role="status"></div>
</div>

<script>
  lucide.createIcons();

  firebase.initializeApp({
    apiKey: "AIzaSyA91GQFimdsUUukDs4ew6uj6TPLj51nNWQ",
    authDomain: "app-repartos-f3fda.firebaseapp.com",
    projectId: "app-repartos-f3fda",
    storageBucket: "app-repartos-f3fda.firebasestorage.app",
    messagingSenderId: "831323740955",
    appId: "1:831323740955:web:60d96b496aefb0047151be"
  });

  var auth = firebase.auth(), db = firebase.firestore();
  var err = document.getElementById("error"), btn = document.getElementById("btn");

  auth.languageCode = "es";
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  var nombresRol = { admin: "Administrador", repartidor: "Repartidor", cliente: "Cliente" };
  var subtitulos = {
    admin: "Acceso para la administración de pedidos",
    repartidor: "Acceso para repartidores: tu ruta del día",
    cliente: "Tiendas y clientes: revisa tus envíos"
  };
  // Rol guardado en Firestore -> pestaña del login. Tiendas (vendedor) y destinatarios (cliente) entran por "Cliente".
  var pestanaDeRol = { admin: "admin", repartidor: "repartidor", vendedor: "cliente", cliente: "cliente" };
  var paginaDeRol = { admin: "panel-admin.html", repartidor: "dashboard-repartidor.html", vendedor: "portal-cliente.html", cliente: "portal-cliente.html" };
  var rolElegido = "admin";

  function elegirRol(rol) {
    if (!nombresRol[rol]) rol = "admin";
    rolElegido = rol;
    document.querySelectorAll(".roles button").forEach(function (b) {
      var activo = b.getAttribute("data-rol") === rol;
      b.classList.toggle("activo", activo);
      b.setAttribute("aria-selected", activo ? "true" : "false");
    });
    document.getElementById("subtitulo").textContent = subtitulos[rol];
    err.textContent = "";
    try { localStorage.setItem("rolLogin", rol); } catch (e) {}
  }

  document.querySelectorAll(".roles button").forEach(function (b) {
    b.addEventListener("click", function () { elegirRol(b.getAttribute("data-rol")); });
  });

  // Pestaña inicial: ?rol=repartidor en la URL, o la última que se usó en este equipo.
  (function () {
    var rolUrl = new URLSearchParams(location.search).get("rol");
    var rolGuardado = null;
    try { rolGuardado = localStorage.getItem("rolLogin"); } catch (e) {}
    elegirRol(rolUrl || rolGuardado || "admin");
  })();

  // validarRol = true solo al pulsar "Iniciar sesión": si la cuenta no corresponde
  // a la pestaña elegida, no se deja entrar.
  function irSegunRol(uid, validarRol) {
    return db.collection("usuarios").doc(uid).get().then(function (d) {
      var p = d.exists ? d.data() : null;
      if (p && p.activo === false) throw new Error("desactivada");
      if (!p) {
        // Tiene clave en Firebase pero no tipo de cuenta: queda como solicitud para que el admin la active.
        var u = auth.currentUser;
        return db.collection("solicitudes").doc(uid).set({
          email: u ? u.email : "",
          fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function () {}).then(function () { throw new Error("pendiente"); });
      }
      var pestana = pestanaDeRol[p.rol];
      if (!pestana) throw new Error("sin-perfil");
      if (validarRol && pestana !== rolElegido) {
        var e = new Error("rol-distinto");
        e.rolReal = pestana;
        throw e;
      }
      location.href = paginaDeRol[p.rol];
    });
  }

  function fallo(e) {
    var m = "No se pudo iniciar sesión. Intenta de nuevo.";
    if (e.message === "sin-perfil") m = "Tu cuenta no tiene un rol asignado. Avisa al administrador.";
    else if (e.message === "pendiente") m = "Tu clave es correcta, pero tu cuenta aún no está activada. Ya le avisamos al administrador: cuando la active podrás entrar.";
    else if (e.message === "desactivada") m = "Tu cuenta está desactivada. Habla con el administrador.";
    else if (e.message === "rol-distinto") m = "Esta cuenta no es de " + nombresRol[rolElegido] + ". Elige la pestaña \"" + nombresRol[e.rolReal] + "\" para ingresar.";
    else if (["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].indexOf(e.code) > -1) m = "Correo o contraseña incorrectos.";
    else if (e.code === "auth/too-many-requests") m = "Demasiados intentos. Espera unos minutos.";
    err.textContent = m; 
    btn.disabled = false; 
    btn.innerHTML = '<i data-lucide="log-in" size="18"></i> Iniciar sesión';
    lucide.createIcons();
    if (["sin-perfil", "rol-distinto", "pendiente", "desactivada"].indexOf(e.message) > -1) auth.signOut();
  }

  function entrar() {
    var email = document.getElementById("email").value.trim(), pass = document.getElementById("password").value;
    if (!email || !pass) { err.textContent = "Completa correo y contraseña."; return; }
    err.textContent = ""; 
    btn.disabled = true; 
    btn.innerHTML = 'Verificando...';
    auth.signInWithEmailAndPassword(email, pass).then(function (c) { return irSegunRol(c.user.uid, true); }).catch(fallo);
  }

  // Envía el correo para crear una contraseña nueva. El mensaje es el mismo exista o no la cuenta,
  // para no revelar qué correos están registrados.
  document.getElementById("olvide").addEventListener("click", function (e) {
    e.preventDefault();
    var exito = document.getElementById("exito");
    var email = document.getElementById("email").value.trim();
    exito.textContent = "";
    if (!email) { err.textContent = "Escribe tu correo arriba y vuelve a tocar «¿Olvidaste tu contraseña?»."; return; }
    err.textContent = "";
    auth.sendPasswordResetEmail(email).then(function () {
      exito.textContent = "Si el correo está registrado, te enviamos un enlace para crear una contraseña nueva. Usa solo el ÚLTIMO correo que llegue (los anteriores dejan de servir), ábrelo antes de 1 hora y revisa también spam.";
    }).catch(function (e2) {
      if (e2.code === "auth/invalid-email") err.textContent = "El correo no es válido.";
      else if (e2.code === "auth/too-many-requests") err.textContent = "Demasiados intentos. Espera unos minutos.";
      else exito.textContent = "Si el correo está registrado, te enviamos un enlace para crear una contraseña nueva. Revisa también la carpeta de spam.";
    });
  });

  btn.addEventListener("click", entrar);
  document.getElementById("password").addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
  auth.onAuthStateChanged(function (u) { if (u && !btn.disabled) irSegunRol(u.uid).catch(function(){}); });
</script>
</body>
</html>
