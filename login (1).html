<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App-Repartos | Iniciar sesión</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b9935a">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Karla',Arial,sans-serif;background:#faf7f4;color:#2f2b28;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #e9e0d8;border-radius:16px;width:100%;max-width:380px;padding:30px 22px}
h1{font-family:'Fraunces',serif;font-size:22px;color:#8f6f3f;margin-bottom:6px}
p.sub{color:#8c8177;font-size:14px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;color:#8c8177;margin-bottom:6px}
input{width:100%;padding:13px;border:1px solid #e9e0d8;border-radius:10px;font-size:15px;font-family:inherit;background:#faf7f4;margin-bottom:14px}
input:focus,button:focus-visible{outline:2px solid #b9935a;outline-offset:1px}
button{width:100%;padding:14px;background:#8f6f3f;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6}
#error{color:#b1615f;font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>App-Repartos</h1>
  <p class="sub">Ingresa con tu correo y contraseña.</p>
  <label for="email">Correo</label>
  <input type="email" id="email" autocomplete="username">
  <label for="password">Contraseña</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="btn">Iniciar sesión</button>
  <div id="error" role="alert"></div>
</div>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyA91GQFimdsUUukDs4ew6uj6TPLj51nNWQ",
  authDomain: "app-repartos-f3fda.firebaseapp.com",
  projectId: "app-repartos-f3fda",
  storageBucket: "app-repartos-f3fda.firebasestorage.app",
  messagingSenderId: "831323740955",
  appId: "1:831323740955:web:60d96b496aefb0047151be"
});
var auth = firebase.auth(), db = firebase.firestore();
var err = document.getElementById("error"), btn = document.getElementById("btn");

function irSegunRol(uid) {
  return db.collection("usuarios").doc(uid).get().then(function (d) {
    var p = d.exists ? d.data() : null;
    if (!p || p.activo === false) throw new Error("sin-perfil");
    if (p.rol === "admin") location.href = "panel-admin.html";
    else if (p.rol === "repartidor") location.href = "dashboard-repartidor.html";
    else throw new Error("sin-perfil");
  });
}
function fallo(e) {
  var m = "No se pudo iniciar sesión. Intenta de nuevo.";
  if (e.message === "sin-perfil") m = "Tu cuenta no tiene un rol asignado. Avisa al administrador.";
  else if (["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].indexOf(e.code) > -1) m = "Correo o contraseña incorrectos.";
  else if (e.code === "auth/too-many-requests") m = "Demasiados intentos. Espera unos minutos.";
  err.textContent = m; btn.disabled = false; btn.textContent = "Iniciar sesión";
  if (e.message === "sin-perfil") auth.signOut();
}
function entrar() {
  var email = document.getElementById("email").value.trim(), pass = document.getElementById("password").value;
  if (!email || !pass) { err.textContent = "Completa correo y contraseña."; return; }
  err.textContent = ""; btn.disabled = true; btn.textContent = "Verificando...";
  auth.signInWithEmailAndPassword(email, pass).then(function (c) { return irSegunRol(c.user.uid); }).catch(fallo);
}
btn.addEventListener("click", entrar);
document.getElementById("password").addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
auth.onAuthStateChanged(function (u) { if (u && !btn.disabled) irSegunRol(u.uid).catch(function(){}); });
</script>
</body>
</html>
