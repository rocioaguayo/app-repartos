<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transporte Leen - Fletes, Mudanzas y Encomiendas</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --navy-main: #132036;
      --navy-card: #1e293b;
      --orange-brand: #ff6a00;
      --orange-hover: #e05d00;
      --orange-light: rgba(255, 106, 0, 0.15);
      --text-white: #ffffff;
      --text-slate: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- ESTILOS DE LOGO --- */
    .brand-logo {
      height: 48px;
      width: 48px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--orange-brand);
      box-shadow: 0 2px 8px rgba(255, 106, 0, 0.3);
    }

    .brand-logo-hero {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--orange-brand);
      box-shadow: 0 10px 25px rgba(255, 106, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    /* --- NAVEGACIÓN --- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 0.75rem 1.5rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text-white);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-slate);
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--orange-brand);
    }

    .btn-nav {
      background: var(--orange-brand);
      color: white !important;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: var(--orange-hover);
    }

    /* --- HERO SECTION --- */
    .hero {
      padding: 8rem 1.5rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange-light);
      color: var(--orange-brand);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(255, 106, 0, 0.3);
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.5rem;
      color: var(--text-white);
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .hero-title span {
      color: var(--orange-brand);
    }

    .slogan-cursivo {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: var(--orange-brand);
      margin-bottom: 1.2rem;
      font-weight: 700;
      line-height: 1;
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-slate);
      margin-bottom: 2rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--orange-brand);
      color: white;
      padding: 0.9rem 1.6rem;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 106, 0, 0.4);
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--orange-hover);
    }

    .btn-secondary {
      background: var(--navy-card);
      color: var(--text-white);
      padding: 0.9rem 1.6rem;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* --- HERO MOCKUP --- */
    .app-preview-card {
      background: var(--navy-main);
      border-radius: var(--radius);
      border: 1px solid var(--orange-brand);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .preview-header {
      background: #090e17;
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .preview-body {
      padding: 1.5rem;
      text-align: center;
    }

    .contact-card-list {
      background: var(--navy-card);
      border-radius: 12px;
      padding: 1.2rem;
      border: 1px solid var(--border);
      text-align: left;
      margin-top: 1rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .contact-item:last-child {
      margin-bottom: 0;
    }

    .contact-item i {
      color: var(--orange-brand);
    }

    /* --- FEATURES SECTION --- */
    .features {
      padding: 4rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
