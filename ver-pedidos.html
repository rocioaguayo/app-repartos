<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Leen · Ver pedidos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b192c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #0b192c;
    --surface: #1e3e62;
    --surface-alt: #172554;
    --border: rgba(255, 255, 255, 0.15);
    --text: #ffffff;
    --text-soft: #cbd5e1;
    --orange: #ff6500;
    --amber: #f59e0b;
    --blue: #60a5fa;
    --green: #10b981;
    --red: #ef4444;
    --purple: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(11, 25, 44, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; text-transform: uppercase; }
  header img { width: 36px; height: 36px; object-fit: cover; border-radius: 50%; border: 2px solid var(--orange); }
  header a { font-size: 12px; color: var(--text-soft); text-decoration: none; background: var(--surface-alt); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); font-weight: 700; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  #estado { font-size: 12px; color: var(--text-soft); margin-bottom: 14px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
  .pedido { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .pedido h3 { font-weight: 800; margin: 0 0 8px 0; font-size: 15px; }
  .campo { font-size: 13px; margin: 3px 0; color: var(--text); }
  .campo b { color: var(--text-soft); font-weight: 600; }
  .estado-pendiente { color: var(--amber); font-weight: 700; }
  .estado-en_camino { color: var(--blue); font-weight: 700; }
  .estado-entregado { color: var(--green); font-weight: 700; }
  .estado-no_entregado { color: var(--red); font-weight: 700; }
  .estado-devuelto { color: var(--purple); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="marca">
    <img src="https://lh3.googleusercontent.com/d/1oL2f76kZu7bM0JVvcVgL9jtYniuKQtSc" alt="Transportes Leen">
    Pedidos en vivo
  </div>
  <a href="panel-admin.html">Ir a Administración</a>
</header>

<main>
  <div id="estado">Verificando sesión...</div>
  <div id="lista"></div>
</main>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyA91GQFimdsUUukDs4ew6uj6TPLj51nNWQ",
    authDomain: "app-repartos-f3fda.firebaseapp.com",
    projectId: "app-repartos-f3fda",
    storageBucket: "app-repartos-f3fda.firebasestorage.app",
    messagingSenderId: "831323740955",
    appId: "1:831323740955:web:60d96b496aefb0047151be"
  });
  var auth = firebase.auth(), db = firebase.firestore();
  var estadoDiv = document.getElementById("estado");
  var listaDiv = document.getElementById("lista");

  var nombresEstado = {
    pendiente: "Pendiente",
    en_camino: "En camino",
    entregado: "Entregado",
    no_entregado: "No entregado",
    devuelto: "Devuelto"
  };

  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }

  // Solo administradores: esta vista muestra todos los pedidos.
  auth.onAuthStateChanged(function (u) {
    if (!u) { location.href = "login.html"; return; }
    db.collection("usuarios").doc(u.uid).get().then(function (d) {
      var p = d.exists ? d.data() : null;
      if (!p || p.rol !== "admin" || p.activo === false) { location.href = "login.html"; return; }
      estadoDiv.textContent = "Conectando a Firestore...";
      db.collection("Pedidos").onSnapshot(pintar, function (error) {
        estadoDiv.textContent = "Error al conectar: " + error.message;
        estadoDiv.style.color = "var(--red)";
      });
    }).catch(function (e) { estadoDiv.textContent = "Error al verificar tu perfil: " + e.message; });
  });

  function pintar(snapshot) {
    estadoDiv.textContent = "Conectado. " + snapshot.size + " pedido(s) encontrados. Se actualiza en tiempo real.";
    listaDiv.innerHTML = "";
    snapshot.forEach(function (doc) {
      var p = doc.data();
      var div = document.createElement("div");
      div.className = "pedido";
      div.innerHTML =
        "<h3>📦 " + esc(doc.id) + "</h3>" +
        "<div class='campo'><b>Código de barra:</b> " + esc(p.codigo_barra || "-") + "</div>" +
        "<div class='campo'><b>Dirección:</b> " + esc(p.direccion_entrega || "-") + "</div>" +
        "<div class='campo'><b>Cliente:</b> " + esc(p.cliente_nombre || "-") + "</div>" +
        "<div class='campo'><b>Vendedor:</b> " + esc(p.vendedor_nombre || p.vendedor_id || "-") + "</div>" +
        "<div class='campo'><b>Repartidor:</b> " + esc(p.repartidor_nombre || p.repartidor_id || "-") + "</div>" +
        "<div class='campo estado-" + esc(p.estado) + "'><b>Estado:</b> " + esc(nombresEstado[p.estado] || p.estado || "-") + "</div>";
      listaDiv.appendChild(div);
    });
  }
</script>

</body>
</html>
